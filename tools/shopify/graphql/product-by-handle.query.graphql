query ProductByHandle($handle: String!) {
  productByHandle(handle: $handle) {
    id
    handle
    title
    status
    media(first: 20) {
      nodes {
        id
        mediaContentType
      }
    }
    variants(first: 10) {
      nodes {
        id
        sku
        price
        selectedOptions {
          name
          value
        }
      }
    }
  }
}
